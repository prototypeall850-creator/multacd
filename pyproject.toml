# multacd — packaging & tool config.
# Runtime deps didefinisikan di [project] (single source buat pip);
# requirements.txt dipertahankan buat setup venv cepat (mirror).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multacd"
version = "2.0.0b3"
description = "Agentic TUI for coding, research, and personal automation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "multacd contributors" }]
keywords = ["ai", "agent", "tui", "cli", "coding-agent", "telegram-bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Terminals",
]

# Dipakai nyata di codebase (jangan tambah yang tak diimport —
# gitpython/cryptography di plan belum dipakai, jadi tidak masuk).
dependencies = [
    "textual>=0.80.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.12.0",
    "python-telegram-bot>=21.0",
    "APScheduler>=3.10.0,<4",
]

[project.optional-dependencies]
# Search ekstra — rantainya bawa Rust TANPA wheel Android:
#   exa-py -> openai -> jiter ; tavily-python -> tiktoken.
# Default install wajib murni-wheel (Termux). Butuh provider ini:
#   pip install "multacd[exa]" / pip install "multacd[tavily]"
exa = [
    "exa-py>=1.0.0",
]
tavily = [
    "tavily-python>=0.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov",
    "pytest-asyncio",
    "ruff>=0.4.0",
    "pyinstaller>=6.0",
]

[project.scripts]
multacd = "main:app"

[project.urls]
Homepage = "https://github.com/prototypeall850-creator/multacd"
Issues = "https://github.com/prototypeall850-creator/multacd/issues"
Changelog = "https://github.com/prototypeall850-creator/multacd/blob/main/CHANGELOG.md"

# Wheel: paket flat di root + entry main.py + soul.md bawaan.
[tool.hatch.build.targets.wheel]
packages = [
    "briefing",
    "core",
    "daemon",
    "memory",
    "scheduler",
    "search_providers",
    "tg",
    "tools",
    "tui",
]

# Sdist: jangan bawa venv/build/output (PyPI tolak file >100MB).
[tool.hatch.build.targets.sdist]
exclude = [
    ".venv",
    ".git",
    "dist",
    "dist_bin",  # artifact binary CI (90MB x N) — jangan ikut sdist!
    "dist_pkg",
    "build",
    "site",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "*.pyc",
    "*.pyo",
]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"soul.md" = "soul.md"

[tool.ruff]
line-length = 120  # style de facto codebase (baris terpanjang ~119)
target-version = "py310"
extend-exclude = [".venv", "multacd.spec", "dist", "build"]

[tool.ruff.lint]
# Selection eksplisit — ruff 0.16+ menyalakan semua rule by default,
# banyak yang false-positive untuk pola project ini (subprocess.run tanpa
# check= itu disengaja, return code dicek manual; blind except = fallback
# anti-crash yang disengaja).
select = ["E", "F", "W", "I", "UP", "SIM", "PIE", "RUF", "EXE"]

[tool.ruff.lint.per-file-ignores]
# BINDINGS/CSS adalah atribut class pola framework Textual, bukan bug.
"tui/app.py" = ["RUF012"]
"tui/screens/main_screen.py" = ["RUF012"]
"tui/screens/setup_wizard.py" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
